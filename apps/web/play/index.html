<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050607">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050607'/%3E%3Cpath d='M20 14h8v14l12-14h10L36 30l14 20H40L28 34v16h-8z' fill='%23e7b84b'/%3E%3C/svg%3E">
  <title>KRKR2 Web Player</title>
  <link rel="stylesheet" href="/play/styles.css">
</head>
<body data-state="loading">
  <header class="player-bar">
    <a class="icon-button" href="/" title="返回游戏库" aria-label="返回游戏库">←</a>
    <strong id="game-title">正在启动</strong>
    <div class="player-actions">
      <span id="save-status">读取存档</span>
      <button id="restart-button" class="icon-button" type="button" title="重新启动游戏" aria-label="重新启动游戏">↻</button>
    </div>
  </header>
  <main class="stage">
    <canvas id="canvas" tabindex="-1"></canvas>
    <div id="loading-panel" class="loading-panel">
      <strong id="status">正在检查本机资源</strong>
      <span id="detail">启动前会完成本机资源完整性校验。</span>
    </div>
  </main>
  <script src="/play/storage.js"></script>
  <script src="/play/prefetch.js"></script>
  <script src="/engine-profiles.js"></script>
  <script src="/engine/krkrsdl2.js"></script>
  <script src="/play/app.js"></script>
</body>
</html>
